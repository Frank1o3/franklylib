name: Publish Maven repo

on:
  workflow_run:
    workflows:
      - Build and Release Fabric Mod
    types:
      - completed
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: [self-hosted, docker, cachyos, arch]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish to Reposilite
        run: ./gradlew publish -DreposiliteUsername=${{ secrets.REPOSILITE_USERNAME }} -DreposilitePassword=${{ secrets.REPOSILITE_PASSWORD }}