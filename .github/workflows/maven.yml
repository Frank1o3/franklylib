name: Publish Maven repo

on:
  workflow_run:
    workflows:
      - Build and Release Fabric Mod
    types:
      - completed
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish to local repo directory
        run: ./gradlew publish

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/repo
          branch: gh-pages
          target-folder: maven
          # `clean: false` so older versions already published to gh-pages aren't
          # deleted every time — Maven repos are additive, each version needs to
          # stay resolvable for anyone still depending on it.
          clean: false
